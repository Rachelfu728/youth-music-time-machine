  <style>
/* ==========================================================================
   青春音樂時光機 - 高級復古 × 現代數位
   Color Palette:
   - 奶油米白: #FBF6EC
   - 墨綠/深綠: #23412F
   - 淡金色: #C9A86A
   - 酒紅: #8A2538
   - 霧灰藍: #486175
   ========================================================================== */

:root {
  --bg-creme: #FBF6EC;
  --bg-creme-soft: #F6F0E4;
  --bg-card: #FFFFFF;
  --bg-card-subtle: #FAF7F0;
  
  --deep-green: #23412F;
  --deep-green-light: #2D523C;
  --deep-green-dark: #193022;
  --deep-green-surface: rgba(35, 65, 47, 0.06);
  
  --pale-gold: #C9A86A;
  --pale-gold-light: #DFC493;
  --pale-gold-glow: rgba(201, 168, 106, 0.18);
  --gold-border: rgba(201, 168, 106, 0.35);

  --wine-red: #8A2538;
  --wine-red-light: #A4354B;
  --wine-red-soft: rgba(138, 37, 56, 0.1);

  --slate-blue: #486175;
  --slate-blue-soft: rgba(72, 97, 117, 0.12);

  --text-primary: #1C2B22;
  --text-secondary: #586B5F;
  --text-tertiary: #84968C;
  --text-gold: #AC8A4C;

  --font-serif: "Noto Serif TC", "Songti TC", "Source Han Serif TC", "Georgia", serif;
  --font-sans: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-display: "Cinzel", "Noto Serif TC", serif;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 26px;
  --radius-full: 9999px;

  --shadow-sm: 0 2px 8px rgba(35, 65, 47, 0.04);
  --shadow-card: 0 8px 24px rgba(35, 65, 47, 0.06), 0 1px 3px rgba(35, 65, 47, 0.03);
  --shadow-hover: 0 12px 32px rgba(35, 65, 47, 0.12), 0 2px 6px rgba(35, 65, 47, 0.04);
  --shadow-float: 0 16px 40px rgba(25, 48, 34, 0.18);

  --nav-height: 68px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  background-color: #EDE7DA;
  color: var(--text-primary);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* 桌面預覽架構：手機置中模擬，可切換寬螢幕 */
.app-viewport-wrapper {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 0;
  background: radial-gradient(circle at 50% 20%, #F5EFE3 0%, #E3DDD0 100%);
}

.mobile-device-container {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  background-color: var(--bg-creme);
  position: relative;
  box-shadow: 0 0 60px rgba(35, 65, 47, 0.15);
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  transition: max-width 0.3s ease;
}

/* 寬螢幕切換模式 (便於電腦檢視時想看大螢幕) */
body.expanded-desktop-mode .mobile-device-container {
  max-width: 980px;
}

/* 手機螢幕時自適應滿版 */
@media (max-width: 600px) {
  .app-viewport-wrapper {
    background: var(--bg-creme);
  }
  .mobile-device-container {
    max-width: 100%;
    box-shadow: none;
  }
}

/* 頂部裝飾金邊細線 */
.top-golden-accent {
  height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--pale-gold) 30%, #EAD5A5 50%, var(--pale-gold) 70%, transparent 100%);
  width: 100%;
}

/* 桌面切換按鈕 */
.desktop-view-toggle {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 1000;
  background: var(--deep-green);
  color: var(--bg-creme);
  border: 1px solid var(--pale-gold);
  border-radius: var(--radius-full);
  padding: 10px 18px;
  font-size: 0.85rem;
  font-weight: 500;
  box-shadow: var(--shadow-float);
  cursor: pointer;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
}
@media (min-width: 992px) {
  .desktop-view-toggle {
    display: inline-flex;
  }
}
.desktop-view-toggle:hover {
  background: var(--deep-green-light);
  transform: translateY(-2px);
}

/* 內容滾動區 */
.main-content {
  flex: 1;
  padding: 16px 20px calc(var(--nav-height) + 36px) 20px;
  overflow-y: auto;
  position: relative;
}

/* 雜誌風格標頭 */
.magazine-header {
  text-align: center;
  padding: 24px 8px 18px 8px;
  position: relative;
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--deep-green-surface);
  color: var(--deep-green);
  border: 1px solid var(--gold-border);
  padding: 4px 14px;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.brand-badge svg {
  color: var(--pale-gold);
}

.app-title {
  font-family: var(--font-serif);
  font-size: 1.95rem;
  font-weight: 700;
  color: var(--deep-green);
  letter-spacing: 2px;
  line-height: 1.25;
  margin-bottom: 12px;
  text-shadow: 0 1px 1px rgba(201, 168, 106, 0.3);
}

.app-subtitle-box {
  position: relative;
  display: inline-block;
  max-width: 320px;
  margin: 0 auto;
  padding: 8px 16px;
}

.app-subtitle-box::before, .app-subtitle-box::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 24px;
  height: 1px;
  background-color: var(--pale-gold);
}
.app-subtitle-box::before { left: -16px; }
.app-subtitle-box::after { right: -16px; }

.app-subtitle {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--text-secondary);
  font-weight: 500;
  font-style: normal;
}

/* 典雅搜尋列 */
.search-container {
  margin: 18px 0 24px 0;
  position: relative;
}

.search-input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  background: var(--bg-card);
  border: 1px solid rgba(201, 168, 106, 0.4);
  border-radius: var(--radius-xl);
  padding: 6px 14px 6px 16px;
  box-shadow: var(--shadow-sm);
  transition: all 0.25s ease;
}

.search-input-wrapper:focus-within {
  border-color: var(--deep-green);
  box-shadow: 0 0 0 3px var(--pale-gold-glow), var(--shadow-sm);
  background: #FFF;
}

.search-icon {
  color: var(--pale-gold);
  flex-shrink: 0;
  margin-right: 10px;
}

.search-input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 0.95rem;
  color: var(--text-primary);
  font-family: var(--font-sans);
  outline: none;
  padding: 6px 0;
}

.search-input::placeholder {
  color: #9AA79E;
  font-size: 0.88rem;
}

.search-clear-btn {
  background: none;
  border: none;
  color: #A0ADA4;
  cursor: pointer;
  padding: 4px;
  display: none;
  border-radius: var(--radius-full);
}
.search-clear-btn.visible {
  display: inline-flex;
}

/* 區塊標題 */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 28px 0 14px 0;
}

.section-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-bullet {
  width: 4px;
  height: 18px;
  background-color: var(--pale-gold);
  border-radius: 2px;
}

.section-title {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--deep-green);
  letter-spacing: 0.5px;
}

.section-desc {
  font-size: 0.8rem;
  color: var(--text-tertiary);
  margin-top: 2px;
}

.section-link {
  font-size: 0.82rem;
  color: var(--pale-gold);
  text-decoration: none;
  cursor: pointer;
  font-weight: 600;
}
.section-link:hover {
  text-decoration: underline;
}

/* ==========================================================================
   年代時光按鈕 (三大大型按鈕)
   ========================================================================== */
.decades-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.decade-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-lg);
  padding: 16px 8px 14px 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.decade-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--pale-gold);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.decade-card:active, .decade-card.active {
  transform: translateY(-3px);
  border-color: var(--deep-green);
  box-shadow: var(--shadow-hover);
  background: #FFFDF9;
}

.decade-card.active::before {
  opacity: 1;
}

.decade-year {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--deep-green);
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.decade-label {
  font-size: 0.75rem;
  color: var(--text-secondary);
  font-weight: 500;
}

.decade-badge {
  font-size: 0.65rem;
  margin-top: 6px;
  padding: 2px 6px;
  border-radius: var(--radius-full);
  background: var(--deep-green-surface);
  color: var(--text-tertiary);
}

/* 快速分類標籤 (華語經典 / 西洋經典 / 我的最愛) */
.quick-filter-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px 0;
  scrollbar-width: none;
}
.quick-filter-bar::-webkit-scrollbar {
  display: none;
}

.filter-pill {
  flex: 1;
  min-width: 95px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--bg-card);
  border: 1px solid rgba(201, 168, 106, 0.3);
  padding: 10px 12px;
  border-radius: var(--radius-full);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--deep-green);
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
}

.filter-pill:hover {
  background: #FFFDF8;
  border-color: var(--pale-gold);
}

.filter-pill.active {
  background: var(--deep-green);
  color: #FFF;
  border-color: var(--deep-green);
  box-shadow: 0 4px 12px rgba(35, 65, 47, 0.2);
}

.filter-pill.heart-pill {
  color: var(--wine-red);
}
.filter-pill.heart-pill.active {
  background: var(--wine-red);
  color: #FFF;
  border-color: var(--wine-red);
}

/* ==========================================================================
   心情選歌 (六大情境選項)
   ========================================================================== */
.mood-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}

.mood-card {
  background: var(--bg-card);
  border: 1px solid rgba(201, 168, 106, 0.25);
  border-radius: var(--radius-md);
  padding: 14px 12px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 10px;
}

.mood-card:hover {
  border-color: var(--pale-gold);
  transform: translateY(-1px);
  background: #FFFDF9;
}

.mood-card.active {
  background: var(--deep-green);
  border-color: var(--deep-green);
  color: #FFF;
  box-shadow: 0 6px 18px rgba(35, 65, 47, 0.18);
}

.mood-icon-wrap {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: var(--bg-creme-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
  flex-shrink: 0;
  transition: background 0.2s;
}

.mood-card.active .mood-icon-wrap {
  background: rgba(255, 255, 255, 0.18);
}

.mood-label {
  font-size: 0.88rem;
  font-weight: 600;
  line-height: 1.3;
}

/* ==========================================================================
   歌手推薦入口 (無侵權照片，抽象黑膠造型)
   ========================================================================== */
.artist-scroll-row {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 6px 0 16px 0;
  scrollbar-width: none;
}
.artist-scroll-row::-webkit-scrollbar {
  display: none;
}

.artist-entry-card {
  flex: 0 0 125px;
  background: var(--bg-card);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-lg);
  padding: 14px 10px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow-card);
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.artist-entry-card:hover {
  transform: translateY(-3px);
  border-color: var(--deep-green);
  box-shadow: var(--shadow-hover);
}

.vinyl-mini-avatar {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: radial-gradient(circle, #3D3D3D 15%, #181818 60%, #0A0A0A 100%);
  border: 2px solid #D5C29D;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  margin-bottom: 8px;
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}

.artist-entry-card:hover .vinyl-mini-avatar {
  transform: rotate(45deg);
}

.vinyl-mini-center {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: #FFF;
  font-weight: 700;
}

.vinyl-center-emerald { background: #23412F; border: 1px solid var(--pale-gold); }
.vinyl-center-ruby { background: #8A2538; border: 1px solid var(--pale-gold); }
.vinyl-center-amber { background: #966C2A; border: 1px solid #FFE4A0; }
.vinyl-center-navy { background: #243E54; border: 1px solid #A5C8E5; }

.artist-name {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--deep-green);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}

.artist-category-tag {
  font-size: 0.7rem;
  color: var(--text-tertiary);
}

/* ==========================================================================
   歌曲卡片 (核心視覺：高級復古雜誌排版)
   ========================================================================== */
.song-cards-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.song-card {
  background: var(--bg-card);
  border: 1px solid rgba(201, 168, 106, 0.35);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-card);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}

.song-card:hover {
  box-shadow: var(--shadow-hover);
  border-color: var(--pale-gold);
}

.song-card-header {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 12px;
}

/* 復古黑膠唱片裝飾 SVG */
.song-vinyl-graphic {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  position: relative;
  cursor: pointer;
}

.song-vinyl-svg {
  width: 100%;
  height: 100%;
  transition: transform 0.8s ease;
  filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12));
}

.song-card:hover .song-vinyl-svg {
  transform: rotate(90deg);
}

.song-info-wrap {
  flex: 1;
  min-width: 0;
}

.song-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.song-title {
  font-family: var(--font-serif);
  font-size: 1.12rem;
  font-weight: 700;
  color: var(--deep-green);
  line-height: 1.35;
  margin-bottom: 2px;
}

.song-artist-decade {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.song-artist-name {
  font-weight: 600;
  color: var(--text-primary);
}

.song-decade-pill {
  font-family: var(--font-display);
  font-size: 0.72rem;
  background: var(--bg-creme-soft);
  color: var(--text-tertiary);
  padding: 1px 7px;
  border-radius: var(--radius-full);
  border: 1px solid rgba(201, 168, 106, 0.25);
}

/* 經典歌詞或曲目背景引言 */
.song-quote {
  font-family: var(--font-serif);
  font-size: 0.85rem;
  line-height: 1.6;
  color: #4C5E53;
  background: var(--bg-card-subtle);
  border-left: 2px solid var(--pale-gold);
  padding: 8px 12px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  margin: 10px 0 14px 0;
  font-style: italic;
}

/* 記憶摘要預覽 (如果此歌已有使用者個人回憶) */
.user-memory-preview {
  background: rgba(201, 168, 106, 0.12);
  border: 1px dashed var(--pale-gold);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  margin: 10px 0 14px 0;
  font-size: 0.85rem;
  color: var(--text-primary);
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.memory-preview-icon {
  color: var(--pale-gold);
  font-size: 1rem;
  flex-shrink: 0;
  margin-top: 1px;
}

.memory-preview-text {
  flex: 1;
  line-height: 1.5;
}

.memory-preview-date {
  font-size: 0.72rem;
  color: var(--text-tertiary);
  margin-top: 4px;
}

/* 卡片操作區 (收藏、寫下回憶、去聽這首歌) */
.song-card-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(201, 168, 106, 0.18);
}

.left-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-icon-action {
  background: none;
  border: 1px solid rgba(201, 168, 106, 0.3);
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.2s ease;
}

.btn-icon-action:hover {
  background: var(--bg-creme-soft);
  border-color: var(--pale-gold);
}

.btn-icon-action.active-favorite {
  background: var(--wine-red-soft);
  border-color: var(--wine-red);
  color: var(--wine-red);
}

window.YOUTH_MUSIC_DATA = {
  MOODS,
  DECADES,
  ARTISTS,
  SONGS
};


/**
 * 青春音樂時光機 - 核心邏輯
 * 
 * 遵守版權原則：
 * - 嚴禁下載、轉檔、自行儲存或串流音訊檔。
 * - 所有歌曲導向合法官方音樂平台（YouTube / Spotify / Apple Music）進行搜尋與聆聽。
 * - 收藏與音樂回憶日記儲存於使用者瀏覽器 LocalStorage。
 */

const { SONGS, ARTISTS, MOODS, DECADES } = window.YOUTH_MUSIC_DATA || {};

class YouthMusicApp {
  constructor() {
    this.activeTab = 'time_machine'; // 'time_machine' | 'explore' | 'favorites' | 'memories'
    this.selectedDecade = null; // null | '1970s' | '1980s' | '1990s'
    this.selectedCategory = 'all'; // 'all' | 'mandarin' | 'western'
    this.selectedMood = null; // null | moodId
    this.selectedArtistId = null; // null | artistId
    this.searchQuery = '';

    // Local Storage 狀態
    this.favorites = this.loadFavorites();
    this.memories = this.loadMemories();

    // 當前開啟的互動歌曲
    this.activeListenSong = null;
    this.activeMemorySong = null;

    this.initElements();
    this.bindEvents();
    this.render();
  }

  // Local Storage 操作
  loadFavorites() {
    try {
      const saved = localStorage.getItem('youth_music_favorites');
      return saved ? JSON.parse(saved) : ['s01', 's09', 's17', 's31']; // 預設提供幾首經典初體驗
    } catch (e) {
      return ['s01', 's09', 's17'];
    }
  }

  saveFavorites() {
    try {
      localStorage.setItem('youth_music_favorites', JSON.stringify(this.favorites));
      this.updateBadges();
    } catch (e) {
      console.error('儲存收藏失敗', e);
    }
  }

  loadMemories() {
    try {
      const saved = localStorage.getItem('youth_music_memories');
      return saved ? JSON.parse(saved) : {
        's01': {
          note: '電影《無間道》裡梁朝偉和劉德華在音響店聽的歌，那種蔡琴天鵝絨般的嗓音，每次聽都起雞皮疙瘩。',
          date: '2024/03/15'
        },
        's09': {
          note: '國中時第一次用卡帶隨身聽聽這首歌，雖然英文還不是很好，但卡本特的歌聲讓我每天放學路上都很溫暖。',
          date: '2024/05/20'
        },
        's17': {
          note: '剛出社會租屋在台北的小套房，那時候每天晚上收音機都在放陳淑樺的歌，不知不覺就走過了幾十年。',
          date: '2024/08/12'
        }
      };
    } catch (e) {
      return {};
    }
  }

  saveMemories() {
    try {
      localStorage.setItem('youth_music_memories', JSON.stringify(this.memories));
      this.updateBadges();
    } catch (e) {
      console.error('儲存回憶失敗', e);
    }
  }

  initElements() {
    // 容器
    this.mainContent = document.getElementById('mainContent');
    this.bottomNav = document.getElementById('bottomNav');
    this.favCountBadge = document.getElementById('favCountBadge');
    this.memoryCountBadge = document.getElementById('memoryCountBadge');

    // 播放彈窗
    this.listenModal = document.getElementById('listenModal');
    this.listenModalTitle = document.getElementById('listenModalTitle');
    this.listenModalArtist = document.getElementById('listenModalArtist');
    this.linkYoutube = document.getElementById('linkYoutube');
    this.linkSpotify = document.getElementById('linkSpotify');
    this.linkAppleMusic = document.getElementById('linkAppleMusic');

    // 回憶編輯彈窗
    this.memoryModal = document.getElementById('memoryModal');
    this.memoryModalTitle = document.getElementById('memoryModalTitle');
    this.memoryModalArtist = document.getElementById('memoryModalArtist');
    this.memoryTextarea = document.getElementById('memoryTextarea');
    this.charCount = document.getElementById('charCount');
    this.btnSaveMemory = document.getElementById('btnSaveMemory');
    this.promptChips = document.querySelectorAll('.prompt-chip');

    // 吐司提示
    this.toast = document.getElementById('toast');
    this.toastMessage = document.getElementById('toastMessage');

    // 寬螢幕切換
    this.desktopToggle = document.getElementById('desktopViewToggle');
  }

  bindEvents() {
    // 底部導航切換
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        const tab = item.dataset.tab;
        if (tab) {
          this.switchTab(tab);
        }
      });
    });

    // 桌面版視窗大小切換
    if (this.desktopToggle) {
      this.desktopToggle.addEventListener('click', () => {
        document.body.classList.toggle('expanded-desktop-mode');
        const isExpanded = document.body.classList.contains('expanded-desktop-mode');
        this.desktopToggle.innerHTML = isExpanded 
          ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2"/></svg> 手機比例預覽`
          : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"/></svg> 寬螢幕全覽`;
      });
    }

    // 回憶字數計算
    if (this.memoryTextarea) {
      this.memoryTextarea.addEventListener('input', () => {
        this.charCount.textContent = `${this.memoryTextarea.value.length} / 500`;
      });
    }

    // 靈感詞快速填入
    this.promptChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const promptText = chip.dataset.prompt;
        if (promptText) {
          if (this.memoryTextarea.value.trim().length > 0) {
            this.memoryTextarea.value += `\n${promptText}`;
          } else {
            this.memoryTextarea.value = promptText;
          }
          this.charCount.textContent = `${this.memoryTextarea.value.length} / 500`;
          this.memoryTextarea.focus();
        }
      });
    });

    // 儲存回憶
    if (this.btnSaveMemory) {
      this.btnSaveMemory.addEventListener('click', () => {
        this.saveCurrentMemory();
      });
    }

    // 點擊彈窗外圍關閉
    window.addEventListener('click', (e) => {
      if (e.target === this.listenModal) {
        this.closeListenModal();
      }
      if (e.target === this.memoryModal) {
        this.closeMemoryModal();
      }
    });

    // 彈窗內關閉按鈕
    document.querySelectorAll('.close-modal-trigger').forEach(btn => {
      btn.addEventListener('click', () => {
        this.closeListenModal();
        this.closeMemoryModal();
      });
    });
  }

  showToast(message) {
    if (!this.toast) return;
    this.toastMessage.textContent = message;
    this.toast.classList.add('show');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => {
      this.toast.classList.remove('show');
    }, 2400);
  }

  updateBadges() {
    if (this.favCountBadge) {
      this.favCountBadge.textContent = this.favorites.length;
      this.favCountBadge.style.display = this.favorites.length > 0 ? 'flex' : 'none';
    }
    if (this.memoryCountBadge) {
      const memoryCount = Object.keys(this.memories).length;
      this.memoryCountBadge.textContent = memoryCount;
      this.memoryCountBadge.style.display = memoryCount > 0 ? 'flex' : 'none';
    }
  }

  switchTab(tab) {
    this.activeTab = tab;
    // 重設個別篩選（避免卡在特定條件下跳轉無結果）
    if (tab === 'time_machine') {
      this.selectedArtistId = null;
    }

    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.toggle('active', item.dataset.tab === tab);
    });

    this.render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  toggleFavorite(songId) {
    const index = this.favorites.indexOf(songId);
    if (index > -1) {
      this.favorites.splice(index, 1);
      this.showToast('已從我的最愛移除');
    } else {
      this.favorites.push(songId);
      this.showToast('❤️ 已珍藏至我的青春歌單');
    }
    this.saveFavorites();
    this.render();
  }

  // 開啟播放對話框 (導向合法串流)
  openListenModal(song) {
    this.activeListenSong = song;
    this.listenModalTitle.textContent = `《${song.title}》`;
    this.listenModalArtist.textContent = `${song.artist} ・ ${song.year || song.decade}`;

    const query = encodeURIComponent(`${song.title} ${song.artist}`);
    
    // 合法官方平台直接搜尋深層連結
    this.linkYoutube.href = `https://www.youtube.com/results?search_query=${query}`;
    this.linkSpotify.href = `https://open.spotify.com/search/${query}`;
    this.linkAppleMusic.href = `https://music.apple.com/tw/search?term=${query}`;

    this.listenModal.classList.add('active');
  }

  closeListenModal() {
    this.listenModal.classList.remove('active');
    this.activeListenSong = null;
  }

  openListenModalById(songId) {
    const song = SONGS.find(s => s.id === songId);
    if (song) this.openListenModal(song);
  }

  // 開啟回憶編輯
  openMemoryModal(song) {
    this.activeMemorySong = song;
    this.memoryModalTitle.textContent = `《${song.title}》`;
    this.memoryModalArtist.textContent = `${song.artist} ・ ${song.decade}`;

    const existing = this.memories[song.id];
    if (existing) {
      this.memoryTextarea.value = existing.note;
    } else {
      this.memoryTextarea.value = '';
    }
    this.charCount.textContent = `${this.memoryTextarea.value.length} / 500`;

    this.memoryModal.classList.add('active');
    setTimeout(() => this.memoryTextarea.focus(), 250);
  }

  openMemoryModalById(songId) {
    const song = SONGS.find(s => s.id === songId);
    if (song) this.openMemoryModal(song);
  }

  closeMemoryModal() {
    this.memoryModal.classList.remove('active');
    this.activeMemorySong = null;
  }

  saveCurrentMemory() {
    if (!this.activeMemorySong) return;
    const text = this.memoryTextarea.value.trim();

    if (text.length === 0) {
      // 若清空則刪除回憶
      if (this.memories[this.activeMemorySong.id]) {
        delete this.memories[this.activeMemorySong.id];
        this.saveMemories();
        this.showToast('已刪除此歌曲回憶');
      }
    } else {
      const now = new Date();
      const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
      
      this.memories[this.activeMemorySong.id] = {
        note: text,
        date: dateStr
      };
      // 自動同時加進最愛
      if (!this.favorites.includes(this.activeMemorySong.id)) {
        this.favorites.push(this.activeMemorySong.id);
        this.saveFavorites();
      }
      this.saveMemories();
      this.showToast('📖 音樂回憶已珍藏在時光機！');
    }

    this.closeMemoryModal();
    this.render();
  }

  deleteMemory(songId) {
    if (confirm('確定要刪除這段珍貴的音樂回憶嗎？')) {
      delete this.memories[songId];
      this.saveMemories();
      this.showToast('回憶已刪除');
      this.render();
    }
  }

  getFilteredExploreSongs() {
    return SONGS.filter(song => {
      // 搜尋條件
      if (this.searchQuery.trim().length > 0) {
        const q = this.searchQuery.toLowerCase().trim();
        const matchTitle = song.title.toLowerCase().includes(q);
        const matchArtist = song.artist.toLowerCase().includes(q);
        const matchDecade = song.decade.toLowerCase().includes(q);
        const matchYear = (song.year || '').includes(q);
        if (!matchTitle && !matchArtist && !matchDecade && !matchYear) return false;
      }

      // 年代條件
      if (this.selectedDecade && song.decade !== this.selectedDecade) return false;

      // 語系分類條件
      if (this.selectedCategory !== 'all' && song.category !== this.selectedCategory) return false;

      // 歌手條件
      if (this.selectedArtistId && song.artistId !== this.selectedArtistId) return false;

      return true;
    });
  }

  renderExploreResults() {
    const filtered = this.getFilteredExploreSongs();
    const activeArtist = ARTISTS.find(a => a.id === this.selectedArtistId);

    return `
      <div class="section-header">
        <div class="section-title-wrap">
          <div class="section-bullet"></div>
          <h3 class="section-title">歌曲收錄</h3>
        </div>
        <span class="section-desc">共 ${filtered.length} 首</span>
      </div>

      ${filtered.length > 0 ? `
        <div class="song-cards-list">
          ${filtered.map(s => this.renderSongCard(s)).join('')}
        </div>
        <!-- 底部探索更多按鈕：直連合法平台搜尋 -->
        ${this.renderSearchFallbackCard(this.searchQuery || (activeArtist ? activeArtist.name : '1970~1990經典老歌'))}
      ` : `
        <!-- 搜尋無結果時的合法串流引導 -->
        ${this.renderSearchFallbackCard(this.searchQuery)}
      `}
    `;
  }

        <div class="brand-badge">MUSIC DISCOVERY</div>
        <h2 class="app-title" style="font-size: 1.6rem;">找尋回憶中的歌曲</h2>
        <p class="app-subtitle" style="font-size: 0.88rem;">輸入歌名、歌手或年代，重溫深藏心底的旋律</p>
      </div>

      <!-- 搜尋輸入框 -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" 
                 id="exploreSearchInput"
                 class="search-input" 
                 placeholder="搜尋歌手、歌曲、年份或歌詞…" 
                 value="${this.searchQuery}" 
                 oninput="window.app.handleSearchInput(this.value)"
          />
          <button id="searchClearBtn" class="search-clear-btn ${this.searchQuery ? 'visible' : ''}" onclick="window.app.clearSearch()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- 快速篩選標籤群 -->
      <div class="quick-filter-bar">
        <button class="filter-pill ${this.selectedCategory === 'all' && !this.selectedDecade && !this.selectedArtistId ? 'active' : ''}" 
                onclick="window.app.resetFilters()">
          全部
        </button>
        <button class="filter-pill ${this.selectedCategory === 'mandarin' ? 'active' : ''}" 
                onclick="window.app.setQuickFilter('mandarin')">
          華語經典
        </button>
        <button class="filter-pill ${this.selectedCategory === 'western' ? 'active' : ''}" 
                onclick="window.app.setQuickFilter('western')">
          西洋經典
        </button>
        <button class="filter-pill ${this.selectedDecade === '1970s' ? 'active' : ''}" 
                onclick="window.app.toggleDecade('1970s')">
          1970s
        </button>
        <button class="filter-pill ${this.selectedDecade === '1980s' ? 'active' : ''}" 
                onclick="window.app.toggleDecade('1980s')">
          1980s
        </button>
        <button class="filter-pill ${this.selectedDecade === '1990s' ? 'active' : ''}" 
                onclick="window.app.toggleDecade('1990s')">
          1990s
        </button>
      </div>

      <!-- 歌手快捷瀏覽列 -->
      <section style="margin-top: 14px;">
        <div class="section-header">
          <div class="section-title-wrap">
            <div class="section-bullet"></div>
            <h3 class="section-title">依歌手探索</h3>
          </div>
          ${this.selectedArtistId ? `<a class="section-link" onclick="window.app.clearArtistFilter()">清除歌手</a>` : ''}
        </div>

        <div class="artist-scroll-row">
          ${ARTISTS.map(a => `
            <div class="artist-entry-card ${this.selectedArtistId === a.id ? 'active' : ''}" 
                 onclick="window.app.filterByArtist('${a.id}')">
              <div class="vinyl-mini-avatar">
                <div class="vinyl-mini-center vinyl-center-${a.badgeStyle}">
                  ${a.name.slice(0, 1)}
                </div>
              </div>
              <div class="artist-name">${a.name}</div>
              <div class="artist-category-tag">${a.category === 'mandarin' ? '華語' : '西洋'}</div>
            </div>
          `).join('')}
        </div>
      </section>

      <!-- 歌手簡介橫幅 (若選取特定歌手) -->
      ${activeArtist ? `
        <div style="background: var(--bg-card); border: 1px solid var(--pale-gold); border-radius: var(--radius-lg); padding: 16px; margin: 16px 0; box-shadow: var(--shadow-sm);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <h4 style="font-family: var(--font-serif); font-size: 1.15rem; color: var(--deep-green);">${activeArtist.name}</h4>
            <span class="song-decade-pill">${activeArtist.category === 'mandarin' ? '華語' : '西洋'}・${activeArtist.decade}</span>
          </div>
          <p style="font-size: 0.85rem; line-height: 1.6; color: var(--text-secondary); margin-bottom: 8px;">${activeArtist.bio}</p>
          <div style="font-size: 0.78rem; color: var(--text-tertiary);">代表作品：${activeArtist.signatureTracks.join('、')}</div>
        </div>
      ` : ''}

      <!-- 搜尋結果或歌曲列表動態容器 -->
      <section id="exploreResultsContainer" style="margin-top: 18px;">
        ${this.renderExploreResults()}
      </section>
    `;
  }

  // 渲染【我的最愛】歌單
  renderFavoritesTab() {
    const favSongs = SONGS.filter(s => this.favorites.includes(s.id));
    let filteredFavs = [...favSongs];

    if (this.selectedCategory !== 'all') {
      filteredFavs = filteredFavs.filter(s => s.category === this.selectedCategory);
    }
    if (this.selectedDecade) {
      filteredFavs = filteredFavs.filter(s => s.decade === this.selectedDecade);
    }

    return `
      <div class="magazine-header" style="padding-bottom: 12px;">
        <div class="brand-badge" style="color: var(--wine-red); border-color: rgba(138, 37, 56, 0.3);">
          MY PRIVATE PLAYLIST
        </div>
        <h2 class="app-title" style="font-size: 1.7rem;">我的青春歌單</h2>
        <p class="app-subtitle" style="font-size: 0.88rem;">
          已珍藏 ${this.favorites.length} 首陪伴人生的經典金曲
        </p>
      </div>

      <!-- 分類標籤 (全部收藏 / 華語 / 西洋 / 1970s / 1980s / 1990s) -->
      <div class="quick-filter-bar">
        <button class="filter-pill ${this.selectedCategory === 'all' && !this.selectedDecade ? 'active' : ''}" 
                onclick="window.app.setFavFilter('all', null)">
          全部收藏 (${favSongs.length})
        </button>
        <button class="filter-pill ${this.selectedCategory === 'mandarin' && !this.selectedDecade ? 'active' : ''}" 
                onclick="window.app.setFavFilter('mandarin', null)">
          華語
        </button>
        <button class="filter-pill ${this.selectedCategory === 'western' && !this.selectedDecade ? 'active' : ''}" 
                onclick="window.app.setFavFilter('western', null)">
          西洋
        </button>
        <button class="filter-pill ${this.selectedDecade === '1970s' ? 'active' : ''}" 
                onclick="window.app.setFavFilter('all', '1970s')">
          1970s
        </button>
        <button class="filter-pill ${this.selectedDecade === '1980s' ? 'active' : ''}" 
                onclick="window.app.setFavFilter('all', '1980s')">
          1980s
        </button>
        <button class="filter-pill ${this.selectedDecade === '1990s' ? 'active' : ''}" 
                onclick="window.app.setFavFilter('all', '1990s')">
          1990s
        </button>
      </div>

      <section style="margin-top: 18px;">
        ${filteredFavs.length > 0 ? `
          <div class="song-cards-list">
            ${filteredFavs.map(s => this.renderSongCard(s)).join('')}
          </div>
        ` : `
          <div class="empty-state-card">
            <div class="empty-state-icon">❤️</div>
            <h3 class="empty-state-title">目前沒有符合的收藏歌曲</h3>
            <p class="empty-state-desc">在時光機中遇見感動的旋律時，點擊愛心圖示，就能將它保存在這裡。</p>
            <button class="btn-empty-action" onclick="window.app.switchTab('time_machine')">返回時光機挑選歌曲</button>
          </div>
        `}
      </section>
    `;
  }

  // 渲染【我的音樂回憶日記】專屬時間軸
  renderMemoriesTab() {
    const memoryKeys = Object.keys(this.memories);
    const diaryEntries = memoryKeys.map(songId => {
      const song = SONGS.find(s => s.id === songId);
      return {
        songId,
        song,
        ...this.memories[songId]
      };
    }).filter(entry => entry.song !== undefined);

    return `
      <!-- 回憶日記頂部雜誌封面風 Banner -->
      <div class="memory-diary-header">
        <h2 class="memory-diary-title">
          <span>📖</span>
          人生音樂日記
        </h2>
        <p class="memory-diary-slogan">
          每一首老歌，都藏著一段青春。<br>
          這不只是一份歌單，而是你生命故事的旋律回憶錄。
        </p>
        <div class="memory-diary-count-pill">
          已累積 ${diaryEntries.length} 篇音樂手記
        </div>
      </div>

      <!-- 回憶列表 -->
      <section>
        ${diaryEntries.length > 0 ? `
          <div class="memory-journal-list">
            ${diaryEntries.map(entry => `
              <div class="memory-journal-card">
                <div class="memory-journal-top">
                  <div class="memory-song-title-group">
                    <span style="font-size: 1.4rem;">📻</span>
                    <div>
                      <h3 style="font-family: var(--font-serif); font-size: 1.1rem; color: var(--deep-green); margin-bottom: 2px;">
                        《${entry.song.title}》
                      </h3>
                      <div style="font-size: 0.8rem; color: var(--text-secondary);">
                        ${entry.song.artist} ・ ${entry.song.year || entry.song.decade}
                      </div>
                    </div>
                  </div>
                  <button class="btn-listen-primary" style="height: 32px; padding: 0 12px; font-size: 0.78rem;" 
                          onclick="window.app.openListenModalById('${entry.songId}')">
                    ▶ 播放
                  </button>
                </div>

                <div class="memory-journal-content">
                  ${entry.note}
                </div>

                <div class="memory-journal-meta">
                  <span>筆記時間：${entry.date || '珍藏時光'}</span>
                  <div class="memory-journal-actions">
                    <button class="btn-text-action" onclick="window.app.openMemoryModalById('${entry.songId}')">
                      ✏️ 編輯
                    </button>
                    <button class="btn-text-action delete" onclick="window.app.deleteMemory('${entry.songId}')">
                      🗑️ 刪除
                    </button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        ` : `
          <div class="empty-state-card">
            <div class="empty-state-icon">✍️</div>
            <h3 class="empty-state-title">尚未寫下音樂回憶</h3>
            <p class="empty-state-desc">
              第一次去英國時常常聽的那首？<br>
              以前深夜開車時最喜歡的旋律？<br>
              在任何歌曲卡片點擊「寫下回憶」，為你的時光日記寫下一頁。
            </p>
            <button class="btn-empty-action" onclick="window.app.switchTab('time_machine')">前往時光機寫下手記</button>
          </div>
        `}
      </section>
    `;
  }

  // 篩選與狀態切換輔助方法
  toggleDecade(decade) {
    if (this.selectedDecade === decade) {
      this.selectedDecade = null;
    } else {
      this.selectedDecade = decade;
    }
    this.render();
  }

  setQuickFilter(cat) {
    this.selectedCategory = cat;
    this.render();
  }

  setFavFilter(cat, decade) {
    this.selectedCategory = cat;
    this.selectedDecade = decade;
    this.render();
  }

  toggleMood(moodId) {
    if (this.selectedMood === moodId) {
      this.selectedMood = null;
    } else {
      this.selectedMood = moodId;
    }
    this.render();
  }

  clearMood() {
    this.selectedMood = null;
    this.render();
  }

  filterByArtist(artistId) {
    this.selectedArtistId = artistId;
    this.switchTab('explore');
  }

  clearArtistFilter() {
    this.selectedArtistId = null;
    this.render();
  }

  handleSearchInput(val) {
    this.searchQuery = val;
    const clearBtn = document.getElementById('searchClearBtn');
    if (clearBtn) {
      clearBtn.classList.toggle('visible', val.trim().length > 0);
    }
    const resultsContainer = document.getElementById('exploreResultsContainer');
    if (resultsContainer) {
      resultsContainer.innerHTML = this.renderExploreResults();
    } else {
      this.render();
    }
  }

  clearSearch() {
    this.searchQuery = '';
    const input = document.getElementById('exploreSearchInput');
    if (input) {
      input.value = '';
      input.focus();
    }
    const clearBtn = document.getElementById('searchClearBtn');
    if (clearBtn) {
      clearBtn.classList.remove('visible');
    }
    const resultsContainer = document.getElementById('exploreResultsContainer');
    if (resultsContainer) {
      resultsContainer.innerHTML = this.renderExploreResults();
    } else {
      this.render();
    }
  }

  resetFilters() {
    this.selectedCategory = 'all';
    this.selectedDecade = null;
    this.selectedArtistId = null;
    this.searchQuery = '';
    this.render();
  }

  // 核心渲染主流程
  render() {
    this.updateBadges();

    if (!this.mainContent) return;

    if (this.activeTab === 'time_machine') {
      this.mainContent.innerHTML = this.renderTimeMachineTab();
    } else if (this.activeTab === 'explore') {
      this.mainContent.innerHTML = this.renderExploreTab();
    } else if (this.activeTab === 'favorites') {
      this.mainContent.innerHTML = this.renderFavoritesTab();
    } else if (this.activeTab === 'memories') {
      this.mainContent.innerHTML = this.renderMemoriesTab();
    }
  }
}

// 應用程式初始化
window.addEventListener('DOMContentLoaded', () => {
  window.app = new YouthMusicApp();
});

</script>

  <!-- PWA Service Worker 註冊 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('✅ PWA Service Worker 註冊成功，範圍：', reg.scope);
          })
          .catch((err) => {
            // 本機 file:// 協定瀏覽器預設不啟動 SW，部署至 HTTPS 伺服器後即自動啟用
            console.log('PWA Service Worker 狀態：', err.message);
          });
      });
    }
  </script>
</body>
</html>
