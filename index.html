/* ==========================================================================
   青春音樂時光機 - 高級復古 × 現代數位
   Color Palette:
   - 奶油米白: #FBF6EC
   - 墨綠/深綠: #23412F
   - 淡金色: #C9A86A
   - 酒紅: #8A2538
   - 霧灰藍: #486175
   ========================================================================== */

:root {
  --bg-creme: #FBF6EC;
  --bg-creme-soft: #F6F0E4;
  --bg-card: #FFFFFF;
  --bg-card-subtle: #FAF7F0;
  
  --deep-green: #23412F;
  --deep-green-light: #2D523C;
  --deep-green-dark: #193022;
  --deep-green-surface: rgba(35, 65, 47, 0.06);
  
  --pale-gold: #C9A86A;
  --pale-gold-light: #DFC493;
  --pale-gold-glow: rgba(201, 168, 106, 0.18);
  --gold-border: rgba(201, 168, 106, 0.35);

  --wine-red: #8A2538;
  --wine-red-light: #A4354B;
  --wine-red-soft: rgba(138, 37, 56, 0.1);

  --slate-blue: #486175;
  --slate-blue-soft: rgba(72, 97, 117, 0.12);

  --text-primary: #1C2B22;
  --text-secondary: #586B5F;
  --text-tertiary: #84968C;
  --text-gold: #AC8A4C;

  --font-serif: "Noto Serif TC", "Songti TC", "Source Han Serif TC", "Georgia", serif;
  --font-sans: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-display: "Cinzel", "Noto Serif TC", serif;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 26px;
  --radius-full: 9999px;

  --shadow-sm: 0 2px 8px rgba(35, 65, 47, 0.04);
  --shadow-card: 0 8px 24px rgba(35, 65, 47, 0.06), 0 1px 3px rgba(35, 65, 47, 0.03);
  --shadow-hover: 0 12px 32px rgba(35, 65, 47, 0.12), 0 2px 6px rgba(35, 65, 47, 0.04);
  --shadow-float: 0 16px 40px rgba(25, 48, 34, 0.18);

  --nav-height: 68px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  background-color: #EDE7DA;
  color: var(--text-primary);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* 桌面預覽架構：手機置中模擬，可切換寬螢幕 */
.app-viewport-wrapper {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 0;
  background: radial-gradient(circle at 50% 20%, #F5EFE3 0%, #E3DDD0 100%);
}

.mobile-device-container {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  background-color: var(--bg-creme);
  position: relative;
  box-shadow: 0 0 60px rgba(35, 65, 47, 0.15);
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  transition: max-width 0.3s ease;
}

/* 寬螢幕切換模式 (便於電腦檢視時想看大螢幕) */
body.expanded-desktop-mode .mobile-device-container {
  max-width: 980px;
}

/* 手機螢幕時自適應滿版 */
@media (max-width: 600px) {
  .app-viewport-wrapper {
    background: var(--bg-creme);
  }
  .mobile-device-container {
    max-width: 100%;
    box-shadow: none;
  }
}

/* 頂部裝飾金邊細線 */
.top-golden-accent {
  height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--pale-gold) 30%, #EAD5A5 50%, var(--pale-gold) 70%, transparent 100%);
  width: 100%;
}

/* 桌面切換按鈕 */
.desktop-view-toggle {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 1000;
  background: var(--deep-green);
  color: var(--bg-creme);
  border: 1px solid var(--pale-gold);
  border-radius: var(--radius-full);
  padding: 10px 18px;
  font-size: 0.85rem;
  font-weight: 500;
  box-shadow: var(--shadow-float);
  cursor: pointer;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
}
@media (min-width: 992px) {
  .desktop-view-toggle {
    display: inline-flex;
  }
}
.desktop-view-toggle:hover {
  background: var(--deep-green-light);
  transform: translateY(-2px);
}

/* 內容滾動區 */
.main-content {
  flex: 1;
  padding: 16px 20px calc(var(--nav-height) + 36px) 20px;
  overflow-y: auto;
  position: relative;
}

/* 雜誌風格標頭 */
.magazine-header {
  text-align: center;
  padding: 24px 8px 18px 8px;
  position: relative;
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--deep-green-surface);
  color: var(--deep-green);
  border: 1px solid var(--gold-border);
  padding: 4px 14px;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.brand-badge svg {
  color: var(--pale-gold);
}

.app-title {
  font-family: var(--font-serif);
  font-size: 1.95rem;
  font-weight: 700;
  color: var(--deep-green);
  letter-spacing: 2px;
  line-height: 1.25;
  margin-bottom: 12px;
  text-shadow: 0 1px 1px rgba(201, 168, 106, 0.3);
}

.app-subtitle-box {
  position: relative;
  display: inline-block;
  max-width: 320px;
  margin: 0 auto;
  padding: 8px 16px;
}

.app-subtitle-box::before, .app-subtitle-box::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 24px;
  height: 1px;
  background-color: var(--pale-gold);
}
.app-subtitle-box::before { left: -16px; }
.app-subtitle-box::after { right: -16px; }

.app-subtitle {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--text-secondary);
  font-weight: 500;
  font-style: normal;
}

/* 典雅搜尋列 */
.search-container {
  margin: 18px 0 24px 0;
  position: relative;
}

.search-input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  background: var(--bg-card);
  border: 1px solid rgba(201, 168, 106, 0.4);
  border-radius: var(--radius-xl);
  padding: 6px 14px 6px 16px;
  box-shadow: var(--shadow-sm);
  transition: all 0.25s ease;
}

.search-input-wrapper:focus-within {
  border-color: var(--deep-green);
  box-shadow: 0 0 0 3px var(--pale-gold-glow), var(--shadow-sm);
  background: #FFF;
}

.search-icon {
  color: var(--pale-gold);
  flex-shrink: 0;
  margin-right: 10px;
}

.search-input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 0.95rem;
  color: var(--text-primary);
  font-family: var(--font-sans);
  outline: none;
  padding: 6px 0;
}

.search-input::placeholder {
  color: #9AA79E;
  font-size: 0.88rem;
}

.search-clear-btn {
  background: none;
  border: none;
  color: #A0ADA4;
  cursor: pointer;
  padding: 4px;
  display: none;
  border-radius: var(--radius-full);
}
.search-clear-btn.visible {
  display: inline-flex;
}

/* 區塊標題 */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 28px 0 14px 0;
}

.section-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-bullet {
  width: 4px;
  height: 18px;
  background-color: var(--pale-gold);
  border-radius: 2px;
}

.section-title {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--deep-green);
  letter-spacing: 0.5px;
}

.section-desc {
  font-size: 0.8rem;
  color: var(--text-tertiary);
  margin-top: 2px;
}

.section-link {
  font-size: 0.82rem;
  color: var(--pale-gold);
  text-decoration: none;
  cursor: pointer;
  font-weight: 600;
}
.section-link:hover {
  text-decoration: underline;
}

/* ==========================================================================
   年代時光按鈕 (三大大型按鈕)
   ========================================================================== */
.decades-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.decade-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-lg);
  padding: 16px 8px 14px 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.decade-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--pale-gold);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.decade-card:active, .decade-card.active {
  transform: translateY(-3px);
  border-color: var(--deep-green);
  box-shadow: var(--shadow-hover);
  background: #FFFDF9;
}

.decade-card.active::before {
  opacity: 1;
}

.decade-year {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--deep-green);
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.decade-label {
  font-size: 0.75rem;
  color: var(--text-secondary);
  font-weight: 500;
}

.decade-badge {
  font-size: 0.65rem;
  margin-top: 6px;
  padding: 2px 6px;
  border-radius: var(--radius-full);
  background: var(--deep-green-surface);
  color: var(--text-tertiary);
}

/* 快速分類標籤 (華語經典 / 西洋經典 / 我的最愛) */
.quick-filter-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px 0;
  scrollbar-width: none;
}
.quick-filter-bar::-webkit-scrollbar {
  display: none;
}

.filter-pill {
  flex: 1;
  min-width: 95px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--bg-card);
  border: 1px solid rgba(201, 168, 106, 0.3);
  padding: 10px 12px;
  border-radius: var(--radius-full);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--deep-green);
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
}

.filter-pill:hover {
  background: #FFFDF8;
  border-color: var(--pale-gold);
}

.filter-pill.active {
  background: var(--deep-green);
  color: #FFF;
  border-color: var(--deep-green);
  box-shadow: 0 4px 12px rgba(35, 65, 47, 0.2);
}

.filter-pill.heart-pill {
  color: var(--wine-red);
}
.filter-pill.heart-pill.active {
  background: var(--wine-red);
  color: #FFF;
  border-color: var(--wine-red);
}

/* ==========================================================================
   心情選歌 (六大情境選項)
   ========================================================================== */
.mood-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}

.mood-card {
  background: var(--bg-card);
  border: 1px solid rgba(201, 168, 106, 0.25);
  border-radius: var(--radius-md);
  padding: 14px 12px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 10px;
}

.mood-card:hover {
  border-color: var(--pale-gold);
  transform: translateY(-1px);
  background: #FFFDF9;
}

.mood-card.active {
  background: var(--deep-green);
  border-color: var(--deep-green);
  color: #FFF;
  box-shadow: 0 6px 18px rgba(35, 65, 47, 0.18);
}

.mood-icon-wrap {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: var(--bg-creme-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
  flex-shrink: 0;
  transition: background 0.2s;
}

.mood-card.active .mood-icon-wrap {
  background: rgba(255, 255, 255, 0.18);
}

.mood-label {
  font-size: 0.88rem;
  font-weight: 600;
  line-height: 1.3;
}

/* ==========================================================================
   歌手推薦入口 (無侵權照片，抽象黑膠造型)
   ========================================================================== */
.artist-scroll-row {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 6px 0 16px 0;
  scrollbar-width: none;
}
.artist-scroll-row::-webkit-scrollbar {
  display: none;
}

.artist-entry-card {
  flex: 0 0 125px;
  background: var(--bg-card);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-lg);
  padding: 14px 10px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow-card);
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.artist-entry-card:hover {
  transform: translateY(-3px);
  border-color: var(--deep-green);
  box-shadow: var(--shadow-hover);
}

.vinyl-mini-avatar {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: radial-gradient(circle, #3D3D3D 15%, #181818 60%, #0A0A0A 100%);
  border: 2px solid #D5C29D;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  margin-bottom: 8px;
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}

.artist-entry-card:hover .vinyl-mini-avatar {
  transform: rotate(45deg);
}

.vinyl-mini-center {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: #FFF;
  font-weight: 700;
}

.vinyl-center-emerald { background: #23412F; border: 1px solid var(--pale-gold); }
.vinyl-center-ruby { background: #8A2538; border: 1px solid var(--pale-gold); }
.vinyl-center-amber { background: #966C2A; border: 1px solid #FFE4A0; }
.vinyl-center-navy { background: #243E54; border: 1px solid #A5C8E5; }

.artist-name {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--deep-green);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}

.artist-category-tag {
  font-size: 0.7rem;
  color: var(--text-tertiary);
}

/* ==========================================================================
   歌曲卡片 (核心視覺：高級復古雜誌排版)
   ========================================================================== */
.song-cards-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.song-card {
  background: var(--bg-card);
  border: 1px solid rgba(201, 168, 106, 0.35);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-card);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}

.song-card:hover {
  box-shadow: var(--shadow-hover);
  border-color: var(--pale-gold);
}

.song-card-header {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 12px;
}

/* 復古黑膠唱片裝飾 SVG */
.song-vinyl-graphic {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  position: relative;
  cursor: pointer;
}

.song-vinyl-svg {
  width: 100%;
  height: 100%;
  transition: transform 0.8s ease;
  filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12));
}

.song-card:hover .song-vinyl-svg {
  transform: rotate(90deg);
}

.song-info-wrap {
  flex: 1;
  min-width: 0;
}

.song-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.song-title {
  font-family: var(--font-serif);
  font-size: 1.12rem;
  font-weight: 700;
  color: var(--deep-green);
  line-height: 1.35;
  margin-bottom: 2px;
}

.song-artist-decade {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.song-artist-name {
  font-weight: 600;
  color: var(--text-primary);
}

.song-decade-pill {
  font-family: var(--font-display);
  font-size: 0.72rem;
  background: var(--bg-creme-soft);
  color: var(--text-tertiary);
  padding: 1px 7px;
  border-radius: var(--radius-full);
  border: 1px solid rgba(201, 168, 106, 0.25);
}

/* 經典歌詞或曲目背景引言 */
.song-quote {
  font-family: var(--font-serif);
  font-size: 0.85rem;
  line-height: 1.6;
  color: #4C5E53;
  background: var(--bg-card-subtle);
  border-left: 2px solid var(--pale-gold);
  padding: 8px 12px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  margin: 10px 0 14px 0;
  font-style: italic;
}

/* 記憶摘要預覽 (如果此歌已有使用者個人回憶) */
.user-memory-preview {
  background: rgba(201, 168, 106, 0.12);
  border: 1px dashed var(--pale-gold);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  margin: 10px 0 14px 0;
  font-size: 0.85rem;
  color: var(--text-primary);
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.memory-preview-icon {
  color: var(--pale-gold);
  font-size: 1rem;
  flex-shrink: 0;
  margin-top: 1px;
}

.memory-preview-text {
  flex: 1;
  line-height: 1.5;
}

.memory-preview-date {
  font-size: 0.72rem;
  color: var(--text-tertiary);
  margin-top: 4px;
}

/* 卡片操作區 (收藏、寫下回憶、去聽這首歌) */
.song-card-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(201, 168, 106, 0.18);
}

.left-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-icon-action {
  background: none;
  border: 1px solid rgba(201, 168, 106, 0.3);
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.2s ease;
}

.btn-icon-action:hover {
  background: var(--bg-creme-soft);
  border-color: var(--pale-gold);
}

.btn-icon-action.active-favorite {
  background: var(--wine-red-soft);
  border-color: var(--wine-red);
  color: var(--wine-red);
}

.btn-memory-note {
  background: none;

.btn-memory-note:hover {

.btn-memory-note.has-memory {

/* 「去聽這首歌」主要按鈕 */
.btn-listen-primary {

  border-radius: var(--radius-full);
  padding: 0 16px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;

  cursor: pointer;

}

.btn-listen-primary:hover {

}

/* ==========================================================================
   搜尋無結果時的合法串流平台探索卡片
   ========================================================================== */
.empty-search-fallback {
  background: var(--bg-card);

}

.fallback-icon {

  margin-bottom: 8px;
}

.fallback-title {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  color: var(--deep-green);
  margin-bottom: 6px;
}

.fallback-desc {
  font-size: 0.85rem;
  line-height: 1.6;
  color: var(--text-secondary);
  margin-bottom: 18px;
}

.fallback-platforms {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.platform-search-btn {

  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--radius-full);
  font-size: 0.9rem;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s ease;

}

.platform-search-btn.btn-yt {
  background: #FFF;
  color: #C4302B;
  border-color: rgba(196, 48, 43, 0.35);
}
.platform-search-btn.btn-yt:hover {
  background: #FFF5F5;
  box-shadow: 0 4px 12px rgba(196, 48, 43, 0.15);
}

.platform-search-btn.btn-spotify {
  background: #FFF;
  color: #1DB954;
  border-color: rgba(29, 185, 84, 0.35);
}
.platform-search-btn.btn-spotify:hover {
  background: #F2FCF5;
  box-shadow: 0 4px 12px rgba(29, 185, 84, 0.15);
}

.platform-search-btn.btn-apple {
  background: #FFF;
  color: #FC3C44;
  border-color: rgba(252, 60, 68, 0.35);
}
.platform-search-btn.btn-apple:hover {
  background: #FFF5F6;
  box-shadow: 0 4px 12px rgba(252, 60, 68, 0.15);
}

/* ==========================================================================
   我的音樂回憶日記專區 (📖 我的回憶)
   ========================================================================== */
.memory-diary-header {
  background: linear-gradient(135deg, var(--deep-green) 0%, #173322 100%);
  color: #FFF;
  border-radius: var(--radius-xl);
  padding: 24px 20px;
  margin-bottom: 22px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-float);
}

.memory-diary-header::after {
  content: "";
  position: absolute;
  bottom: -20px;
  right: -20px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 1px solid rgba(201, 168, 106, 0.2);
}

.memory-diary-title {
  font-family: var(--font-serif);
  font-size: 1.4rem;
  color: #FFF;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.memory-diary-slogan {
  font-size: 0.88rem;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.85);
  font-family: var(--font-serif);
}

.memory-diary-count-pill {
  display: inline-block;
  background: rgba(201, 168, 106, 0.25);
  color: #F8E6C0;
  border: 1px solid var(--pale-gold);
  padding: 3px 12px;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  margin-top: 12px;
}

.memory-journal-card {
  background: var(--bg-card);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--shadow-card);
  margin-bottom: 16px;
  position: relative;
  transition: all 0.25s ease;
}

.memory-journal-card:hover {
  box-shadow: var(--shadow-hover);
  border-color: var(--pale-gold);
}

.memory-journal-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--deep-green-surface);
}

.memory-song-title-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.memory-journal-content {
  font-family: var(--font-serif);
  font-size: 0.96rem;
  line-height: 1.8;
  color: var(--text-primary);
  white-space: pre-wrap;
  background: var(--bg-card-subtle);
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border-left: 3px solid var(--wine-red);
  margin-bottom: 12px;
}

.memory-journal-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--text-tertiary);
}

.memory-journal-actions {
  display: flex;
  gap: 8px;
}

.btn-text-action {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 0.78rem;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  transition: all 0.2s;
}

.btn-text-action:hover {
  background: var(--deep-green-surface);
  color: var(--deep-green);
}

.btn-text-action.delete:hover {
  color: var(--wine-red);
}

/* ==========================================================================
   底部導覽列 (Mobile-First Fixed Bottom Navigation)
   ========================================================================== */
.bottom-navigation {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: var(--nav-height);
  background: rgba(251, 246, 236, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(201, 168, 106, 0.35);
  box-shadow: 0 -4px 20px rgba(35, 65, 47, 0.08);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 500;
  padding: 0 10px;
  transition: max-width 0.3s ease;
}

body.expanded-desktop-mode .bottom-navigation {
  max-width: 980px;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: #6C7D73;
  text-decoration: none;
  cursor: pointer;
  border: none;
  background: none;
  padding: 8px 4px;
  transition: all 0.2s ease;
  position: relative;
}

.nav-icon-box {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 0.2s ease;
}

.nav-label {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.nav-badge-count {
  position: absolute;
  top: -2px;
  right: -4px;
  background: var(--wine-red);
  color: #FFF;
  font-size: 0.62rem;
  min-width: 16px;
  height: 16px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  font-weight: 700;
}

.nav-item.active {
  color: var(--deep-green);
}

.nav-item.active .nav-icon-box {
  transform: translateY(-2px);
  color: var(--deep-green);
}

.nav-item.active .nav-label {
  font-weight: 700;
  color: var(--deep-green);
}

.nav-item.active::before {
  content: "";
  position: absolute;
  top: 0;
  width: 24px;
  height: 3px;
  background-color: var(--pale-gold);
  border-radius: 0 0 2px 2px;
}

/* ==========================================================================
   彈出視窗 & 底部抽屜 (Bottom Sheet Modal)
   ========================================================================== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(18, 33, 24, 0.6);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  z-index: 1000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.bottom-sheet {
  background: var(--bg-card);
  width: 100%;
  max-width: 480px;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  border-top: 1px solid var(--pale-gold);
  padding: 20px 24px calc(24px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-float);
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  max-height: 85vh;
  overflow-y: auto;
}

.modal-overlay.active .bottom-sheet {
  transform: translateY(0);
}

body.expanded-desktop-mode .bottom-sheet {
  max-width: 580px;
}

.sheet-handle {
  width: 40px;
  height: 4px;
  background: rgba(201, 168, 106, 0.4);
  border-radius: var(--radius-full);
  margin: 0 auto 16px auto;
}

.sheet-header {
  text-align: center;
  margin-bottom: 20px;
}

.sheet-title {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  color: var(--deep-green);
  font-weight: 700;
  margin-bottom: 4px;
}

.sheet-subtitle {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.legal-notice-box {
  background: var(--bg-card-subtle);
  border: 1px solid rgba(201, 168, 106, 0.35);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  font-size: 0.78rem;
  line-height: 1.5;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
}

.legal-notice-box svg {
  color: var(--pale-gold);
  flex-shrink: 0;
}

/* 官方串流平台直連按鈕 */
.platform-links-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.platform-link-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-radius: var(--radius-md);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.95rem;
  transition: all 0.2s ease;
  border: 1px solid transparent;
}

.platform-link-btn:hover {
  transform: translateY(-2px);
}

.platform-link-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.platform-link-btn.youtube {
  background: #FFF;
  color: #282828;
  border-color: #E2E2E2;
}
.platform-link-btn.youtube:hover {
  border-color: #FF0000;
  background: #FFF8F8;
  box-shadow: 0 4px 14px rgba(255, 0, 0, 0.12);
}

.platform-link-btn.spotify {
  background: #FFF;
  color: #191414;
  border-color: #E2E2E2;
}
.platform-link-btn.spotify:hover {
  border-color: #1DB954;
  background: #F4FBF6;
  box-shadow: 0 4px 14px rgba(29, 185, 84, 0.12);
}

.platform-link-btn.applemusic {
  background: #FFF;
  color: #232323;
  border-color: #E2E2E2;
}
.platform-link-btn.applemusic:hover {
  border-color: #FC3C44;
  background: #FFF5F6;
  box-shadow: 0 4px 14px rgba(252, 60, 68, 0.12);
}

.sheet-close-btn {
  width: 100%;
  padding: 12px;
  border: 1px solid rgba(201, 168, 106, 0.35);
  background: var(--bg-card);
  color: var(--text-secondary);
  border-radius: var(--radius-full);
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
}
.sheet-close-btn:hover {
  background: var(--bg-creme-soft);
}

/* ==========================================================================
   音樂回憶撰寫面板 (這首歌讓我想到……)
   ========================================================================== */
.memory-editor-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.quick-prompt-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 6px;
}

.prompt-chip {
  background: var(--bg-creme-soft);
  border: 1px solid rgba(201, 168, 106, 0.35);
  border-radius: var(--radius-full);
  padding: 6px 12px;
  font-size: 0.78rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.prompt-chip:hover {
  background: var(--deep-green-surface);
  color: var(--deep-green);
  border-color: var(--deep-green);
}

.memory-textarea {
  width: 100%;
  min-height: 120px;
  background: var(--bg-creme-soft);
  border: 1px solid rgba(201, 168, 106, 0.4);
  border-radius: var(--radius-md);
  padding: 14px;
  font-family: var(--font-serif);
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--text-primary);
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
}

.memory-textarea:focus {
  border-color: var(--deep-green);
  background: #FFF;
}

.memory-editor-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.char-counter {
  font-size: 0.75rem;
  color: var(--text-tertiary);
}

.btn-save-memory {
  background: var(--wine-red);
  color: #FFF;
  border: none;
  padding: 12px 24px;
  border-radius: var(--radius-full);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(138, 37, 56, 0.25);
}

.btn-save-memory:hover {
  background: var(--wine-red-light);
  transform: translateY(-1px);
}

/* ==========================================================================
   輕量級 Toast 提示
   ========================================================================== */
.toast-container {
  position: fixed;
  bottom: calc(var(--nav-height) + 16px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  pointer-events: none;
}

.toast {
  background: rgba(25, 48, 34, 0.92);
  color: #FFF;
  border: 1px solid var(--pale-gold);
  border-radius: var(--radius-full);
  padding: 10px 20px;
  font-size: 0.85rem;
  box-shadow: var(--shadow-float);
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  transform: translateY(12px);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* 空狀態提示卡片 */
.empty-state-card {
  text-align: center;
  padding: 40px 20px;
  background: var(--bg-card);
  border: 1px dashed var(--gold-border);
  border-radius: var(--radius-xl);
  margin: 20px 0;
}

.empty-state-icon {
  font-size: 2.8rem;
  margin-bottom: 12px;
  color: var(--pale-gold);
}

.empty-state-title {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  color: var(--deep-green);
  margin-bottom: 6px;
  font-weight: 700;
}

.empty-state-desc {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.6;
  max-width: 280px;
  margin: 0 auto 16px auto;
}

.btn-empty-action {
  background: var(--deep-green);
  color: #FFF;
  border: none;
  padding: 10px 22px;
  border-radius: var(--radius-full);
  font-size: 0.85rem;
  cursor: pointer;
  font-weight: 600;
}


/* ==========================================================================
   老式收音機調頻 & 靈感曲庫 UI
   ========================================================================== */

/* 收音機隨機調頻按鈕 */
.radio-tuner-card {
  margin: 16px 0 20px 0;
  background: linear-gradient(135deg, #1C3325 0%, #2A4D38 100%);
  border: 1px solid var(--pale-gold);
  border-radius: var(--radius-xl);
  padding: 16px 18px;
  color: #FFF;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 8px 24px rgba(28, 51, 37, 0.25);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

.radio-tuner-card:active {
  transform: scale(0.98);
}

.radio-tuner-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 50%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(201, 168, 106, 0.2), transparent);
  animation: radioShimmer 3.5s infinite;
}

@keyframes radioShimmer {
  0% { left: -100%; }
  60% { left: 200%; }
  100% { left: 200%; }
}

.radio-tuner-info {
  display: flex;
  align-items: center;
  gap: 14px;
}

.radio-dial-icon {
  width: 44px;
  height: 44px;
  background: rgba(201, 168, 106, 0.2);
  border: 1px solid var(--pale-gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}

.radio-tuner-title {
  font-family: var(--font-serif);
  font-size: 1rem;
  font-weight: 700;
  color: #F6F0E4;
  margin-bottom: 2px;
}

.radio-tuner-desc {
  font-size: 0.75rem;
  color: #DFC493;
}

.radio-tune-btn {
  background: var(--pale-gold);
  color: #193022;
  border: none;
  font-size: 0.8rem;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

/* 靈感庫入口橫幅 */
.inspiration-banner-card {
  margin: 12px 0 20px 0;
  background: #FFF;
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: var(--shadow-sm);
}

.inspiration-banner-card:active {
  background: var(--bg-card-subtle);
  transform: scale(0.99);
}

.inspiration-banner-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.inspiration-star-icon {
  font-size: 1.5rem;
  line-height: 1;
}

.inspiration-banner-title {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--deep-green);
}

.inspiration-banner-sub {
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.inspiration-open-btn {
  background: var(--deep-green-surface);
  color: var(--deep-green);
  border: 1px solid rgba(35, 65, 47, 0.2);
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
}

/* 收音機調頻彈窗視覺 */
.radio-display-dial {
  background: #111A14;
  border: 2px solid #3A5A44;
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 2px 10px rgba(0,0,0,0.6);
}

.radio-freq-scale {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-display);
  font-size: 0.7rem;
  color: #C9A86A;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.radio-needle-track {
  height: 24px;
  background: rgba(201, 168, 106, 0.08);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
}

.radio-needle {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 3px;
  background: #FF4757;
  box-shadow: 0 0 8px #FF4757;
  left: 65%;
  transition: left 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}

.radio-needle.tuning {
  animation: needleScan 0.8s ease-in-out;
}

@keyframes needleScan {
  0% { left: 10%; }
  40% { left: 90%; }
  75% { left: 25%; }
  100% { left: 65%; }
}

.radio-station-text {
  text-align: center;
  font-size: 0.75rem;
  color: #A3B899;
  margin-top: 8px;
  letter-spacing: 0.5px;
}

/* 靈感庫主題標籤 */
.inspiration-theme-pills {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 14px 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.inspiration-theme-pills::-webkit-scrollbar {

    // Local Storage 狀態載入
    this.favorites = this.loadFavorites();
    this.memories = this.loadMemories();
    this.customSongs = this.loadCustomSongs(); // 使用者從靈感庫一鍵收錄的歌曲

    // 作用中的彈窗歌曲
    this.activeListenSong = null;

  getAllSongs() {
    const map = new Map();
    // 預設核心歌曲
    (this.data.SONGS || []).forEach(s => map.set(s.id, s));
    // 使用者收錄歌曲
    (this.customSongs || []).forEach(s => map.set(s.id, s));
    return Array.from(map.values());
  }

    try {
      const saved = localStorage.getItem('youth_music_favorites');
      return saved ? JSON.parse(saved) : ['s01', 's06', 's17', 's31']; // 預設推薦數首經典

      return ['s01', 's06', 's17'];

    }
  }

  loadCustomSongs() {
    try {
      const saved = localStorage.getItem('youth_music_custom_songs');
      return saved ? JSON.parse(saved) : [];
    } catch (e) {
      return [];
    }
  }

  saveCustomSongs() {
    try {
      localStorage.setItem('youth_music_custom_songs', JSON.stringify(this.customSongs));
    } catch (e) {
      console.error('儲存自訂收錄歌曲失敗:', e);
    }
  }

  // 靈感庫收錄歌曲切換
  addSongFromInspiration(song) {
    if (!this.customSongs.some(s => s.id === song.id)) {
      this.customSongs.push(song);
      this.saveCustomSongs();
      this.showToast(`已收錄《${song.title}》進時光機！✨`);
      this.render();
      this.renderInspirationList();
    }
  }

  removeSongFromInspiration(songId) {
    this.customSongs = this.customSongs.filter(s => s.id !== songId);
    this.saveCustomSongs();
    this.showToast('已從時光機移除該歌曲');
    this.render();
    this.renderInspirationList();
  }

  toggleFavorite(songId) {
    const index = this.favorites.indexOf(songId);
    let added = false;
    if (index > -1) {
      this.favorites.splice(index, 1);
    } else {
      this.favorites.push(songId);
      added = true;
    }
    this.saveFavorites();
    this.showToast(added ? '已收藏至「我的青春歌單」 ❤️' : '已從收藏中移除');
    this.render();
  }

  setMemory(songId, noteText) {
    if (!noteText || !noteText.trim()) {
      delete this.memories[songId];
    } else {
      const now = new Date();
      const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
      this.memories[songId] = {
        note: noteText.trim(),
        date: dateStr
      };
    }
    this.saveMemories();
    this.showToast('回憶日記已儲存 📖');
    this.render();
  }

  deleteMemory(songId) {
    if (this.memories[songId]) {
      delete this.memories[songId];
      this.saveMemories();
      this.showToast('回憶紀錄已刪除');
      this.render();
    }
  }

  initElements() {
    this.mainContent = document.getElementById('mainContent');
    this.navBtns = document.querySelectorAll('.nav-item');
    this.listenModal = document.getElementById('listenModal');
    this.memoryModal = document.getElementById('memoryModal');
    this.radioModal = document.getElementById('radioModal');
    this.inspirationModal = document.getElementById('inspirationModal');
    this.toast = document.getElementById('toast');
    this.favBadge = document.getElementById('favBadge');
    this.memoryBadge = document.getElementById('memoryBadge');
  }

  bindEvents() {
    // 底部導覽列切換
    this.navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        if (tab) {
          this.switchTab(tab);
        }
      });
    });

    // 彈窗背景點擊關閉
    [this.listenModal, this.memoryModal, this.radioModal, this.inspirationModal].forEach(modal => {
      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal || e.target.classList.contains('modal-backdrop')) {
            modal.classList.remove('active');
          }
        });
      }
    });

    // 全螢幕 / 居中視角切換（大螢幕體驗友善）
    const desktopToggle = document.getElementById('desktopViewToggle');
    if (desktopToggle) {
      desktopToggle.addEventListener('click', () => {
        document.body.classList.toggle('desktop-wide-mode');
        const isWide = document.body.classList.contains('desktop-wide-mode');
        desktopToggle.innerHTML = isWide ? `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>
          </svg> 手機比例模式
        ` : `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="20" height="14" x="2" y="5" rx="2"/><path d="M12 19v3"/><path d="M8 22h8"/>
          </svg> 寬螢幕模式
        `;
      });
    }
  }

  switchTab(tab) {
    this.activeTab = tab;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    this.render();
  }

  updateBadges() {
    if (this.favBadge) {
      const count = this.favorites.length;
      this.favBadge.textContent = count > 0 ? count : '';
      this.favBadge.style.display = count > 0 ? 'inline-flex' : 'none';
    }
    if (this.memoryBadge) {
      const count = Object.keys(this.memories).length;
      this.memoryBadge.textContent = count > 0 ? count : '';
      this.memoryBadge.style.display = count > 0 ? 'inline-flex' : 'none';
    }
  }

  showToast(message) {
    if (!this.toast) return;
    this.toast.textContent = message;
    this.toast.classList.add('show');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => {
      this.toast.classList.remove('show');
    }, 2400);
  }

  // -------------------------------------------------------------
  // 畫面渲染總入口
  // -------------------------------------------------------------
  render() {
    // 更新導覽列高亮
    this.navBtns.forEach(btn => {
      const tab = btn.dataset.tab;
      if (tab === this.activeTab) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    this.updateBadges();

    // 渲染分頁內容
    let contentHtml = '';
    switch (this.activeTab) {
      case 'time_machine':
        contentHtml = this.renderTimeMachineTab();
        break;
      case 'explore':
        contentHtml = this.renderExploreTab();
        break;
      case 'favorites':
        contentHtml = this.renderFavoritesTab();
        break;
      case 'memories':
        contentHtml = this.renderMemoriesTab();
        break;
      default:
        contentHtml = this.renderTimeMachineTab();
    }

    this.mainContent.innerHTML = contentHtml;
    this.bindTabInteractions();
  }

  // -------------------------------------------------------------
  // 歌曲篩選邏輯
  // -------------------------------------------------------------
  getFilteredSongs() {
    let result = this.getAllSongs();

    // 搜尋字串過濾（歌手、歌名、年代）
    if (this.searchQuery && this.searchQuery.trim()) {
      const q = this.searchQuery.trim().toLowerCase();
      result = result.filter(song => {
        return (
          song.title.toLowerCase().includes(q) ||
          song.artist.toLowerCase().includes(q) ||
          song.year.includes(q) ||
          song.decade.toLowerCase().includes(q) ||
          song.quote.toLowerCase().includes(q)
        );
      });
      return result;
    }

    // 歌手專屬過濾
    if (this.selectedArtistId) {
      result = result.filter(song => song.artistId === this.selectedArtistId);
    }

    // 年代過濾
    if (this.selectedDecade) {
      result = result.filter(song => song.decade === this.selectedDecade);
    }

    // 分類過濾 (華語 / 西洋)
    if (this.selectedCategory && this.selectedCategory !== 'all') {
      result = result.filter(song => song.category === this.selectedCategory);
    }

    // 心情過濾
    if (this.selectedMood) {
      result = result.filter(song => song.moods && song.moods.includes(this.selectedMood));
    }

    return result;
  }

  getListTitle() {
    if (this.searchQuery) {
      return `搜尋結果「${this.searchQuery}」`;
    }
    if (this.selectedMood) {
      const m = this.data.MOODS.find(x => x.id === this.selectedMood);
      return m ? `${m.icon} ${m.label}・精選歌曲` : '心情精選';
    }
    if (this.selectedDecade) {
      const d = this.data.DECADES.find(x => x.id === this.selectedDecade);
      return d ? `${d.title}` : `${this.selectedDecade} 經典`;
    }
    if (this.selectedCategory === 'mandarin') {
      return '華語流行經典推薦';
    }
    if (this.selectedCategory === 'western') {
      return '西洋黃金金曲推薦';
    }
    return '經典熱門推薦';
  }

  // -------------------------------------------------------------
  // 綁定動態生成元素的事件
  // -------------------------------------------------------------
  bindTabInteractions() {
    // 頂部搜尋欄輸入
    const searchInput = document.getElementById('topSearchInput');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        this.searchQuery = e.target.value;
        this.render();
        const newInp = document.getElementById('topSearchInput');
        if (newInp) {
          newInp.focus();
          newInp.selectionStart = newInp.selectionEnd = newInp.value.length;
        }
      });
    }

    const clearSearchBtn = document.getElementById('clearSearchBtn');
    if (clearSearchBtn) {
      clearSearchBtn.addEventListener('click', () => {
        this.searchQuery = '';
        this.render();
      });
    }

    // 老式收音機調頻卡片點擊
    const openRadioCard = document.getElementById('openRadioCard');
    if (openRadioCard) {
      openRadioCard.addEventListener('click', () => {
        this.openRadioModal();
      });
    }

    // 時光靈感庫橫幅點擊
    const openInspCards = [document.getElementById('openInspirationCard'), document.getElementById('openInspirationCardExplore')];
    openInspCards.forEach(card => {
      if (card) {
        card.addEventListener('click', () => {
          this.openInspirationModal();
        });
      }
    });

    // 年代卡片點擊
    document.querySelectorAll('.decade-card').forEach(btn => {
      btn.addEventListener('click', () => {
        const decade = btn.dataset.decade;
        this.selectedDecade = this.selectedDecade === decade ? null : decade;
        this.selectedMood = null;
        this.searchQuery = '';
        this.render();
      });
    });

    // 類別標籤點擊
    document.querySelectorAll('[data-category]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.category;
        this.selectedCategory = this.selectedCategory === cat ? 'all' : cat;
        this.render();
      });
    });

    // 心情卡片點擊
    document.querySelectorAll('.mood-card').forEach(btn => {
      btn.addEventListener('click', () => {
        const mood = btn.dataset.mood;
        this.selectedMood = this.selectedMood === mood ? null : mood;
        this.render();
      });
    });

    // 歌手卡片點擊
    document.querySelectorAll('.artist-card').forEach(btn => {
      btn.addEventListener('click', () => {
        const artist = btn.dataset.artist;
        this.selectedArtistId = this.selectedArtistId === artist ? null : artist;
        this.render();
      });
    });

    // 清除歌手篩選
    document.querySelectorAll('[data-action="clear-artist"]').forEach(btn => {
      btn.addEventListener('click', () => {
        this.selectedArtistId = null;
        this.render();
      });
    });

    // 我的最愛篩選標籤
    document.querySelectorAll('[data-fav-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        const f = btn.dataset.favFilter;
        if (f === 'all') {
          this.selectedCategory = 'all';
          this.selectedDecade = null;
        } else if (f === 'mandarin' || f === 'western') {
          this.selectedCategory = f;
          this.selectedDecade = null;
        } else if (f.startsWith('19')) {
          this.selectedDecade = f;
          this.selectedCategory = 'all';
        }
        this.render();
      });
    });

    // 重設全部篩選
    document.querySelectorAll('[data-action="reset-filters"]').forEach(btn => {
      btn.addEventListener('click', () => {
        this.selectedDecade = null;
        this.selectedCategory = 'all';
        this.selectedMood = null;
        this.selectedArtistId = null;
        this.searchQuery = '';
        this.render();
      });
    });

    // 前往時光機 / 前往最愛
    document.querySelectorAll('[data-action="go-timemachine"]').forEach(btn => {
      btn.addEventListener('click', () => this.switchTab('time_machine'));
    });
    document.querySelectorAll('[data-action="go-favorites"]').forEach(btn => {
      btn.addEventListener('click', () => this.switchTab('favorites'));
    });

    // 愛心收藏切換
    document.querySelectorAll('.favorite-toggle-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.songId;
        if (id) this.toggleFavorite(id);
      });
    });

    // 去聽這首歌點擊
    document.querySelectorAll('[data-action="listen"], .listen-action-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.songId;
        if (id) {
          const all = this.getAllSongs();
          const song = all.find(s => s.id === id);
          if (song) this.openListenModal(song);
        }
      });
    });

    // 這首歌讓我想到…… 回憶筆記點擊
    document.querySelectorAll('[data-action="memory"], .edit-mem-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.songId;
        if (id) {
          const all = this.getAllSongs();
          const song = all.find(s => s.id === id);
          if (song) this.openMemoryModal(song);
        }
      });
    });
  }

  openRadioModal() {
    if (!this.radioModal) return;
    this.tuneRandomSong();
    this.radioModal.classList.add('active');
  }

  tuneRandomSong() {
    const all = this.getAllSongs();
    if (!all.length) return;
    const randomIndex = Math.floor(Math.random() * all.length);
    const song = all[randomIndex];
    this.currentTunedSong = song;

    const modalContent = document.getElementById('radioModalContent');
    if (!modalContent) return;

    // 隨機 FM 頻率 (88.0 ~ 107.5)
    const randomFreq = (88.0 + Math.random() * 19.5).toFixed(1);
    const needlePercent = Math.floor(15 + Math.random() * 70);

    const isFav = this.favorites.includes(song.id);

    modalContent.innerHTML = `
      <div class="modal-header">
        <div class="modal-badge">時光收音機調頻中</div>
        <h3 class="modal-title">📻 穿越時空，調頻至 ${randomFreq} MHz</h3>
        <button class="modal-close-x" id="closeRadioModalX">✕</button>
      </div>

      <div class="modal-body">
        <!-- 復古調頻刻度盤 -->
        <div class="radio-display-dial">
          <div class="radio-freq-scale">
            <span>FM 88</span>
            <span>94</span>
            <span>100</span>
            <span>106</span>
            <span>108 MHz</span>
          </div>
          <div class="radio-needle-track">
            <div class="radio-needle tuning" style="left: ${needlePercent}%;"></div>
          </div>
          <div class="radio-station-text">✦ 接收到來自 ${song.year} 年 ${song.decade} 的時光電波 ✦</div>
        </div>

        <!-- 調頻接收到的歌曲卡片 -->
        <div class="song-card" style="box-shadow: none; border: 1px solid var(--gold-border);">
          <div class="song-card-main">
            <div class="vinyl-thumbnail">
              <div class="vinyl-outer-groove">
                <div class="vinyl-inner-label">
                  <span class="vinyl-mini-year">${song.year}</span>
                </div>
              </div>
              <div class="vinyl-center-hole"></div>
            </div>

            <div class="song-info-wrapper">
              <div class="song-header-line">
                <span class="song-decade-pill">${song.decade}</span>
                <span class="song-category-pill">${song.category === 'mandarin' ? '華語' : '西洋'}</span>
              </div>
              <h4 class="song-title">${song.title}</h4>
              <div class="song-artist-line">
                <span class="song-artist-name">${song.artist}</span>
                <span class="song-year-dot">·</span>
                <span class="song-release-year">${song.year}</span>
              </div>
              <p class="song-poetic-quote">「${song.quote}」</p>
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 18px;">
          <button class="primary-btn" id="radioListenBtn" style="flex: 1;">
            🎧 前往合法平台聽歌
          </button>
          <button class="secondary-btn" id="radioFavBtn">
            ${isFav ? '❤️ 已在最愛' : '❤️ 收藏'}
          </button>
        </div>

        <div style="text-align: center; margin-top: 14px;">
          <button class="clear-filters-link" id="radioRetuneBtn" style="font-size: 0.9rem; cursor: pointer;">
            🔄 再轉一台（換首時光金曲）
          </button>
        </div>
      </div>
    `;

    document.getElementById('closeRadioModalX').addEventListener('click', () => {
      this.radioModal.classList.remove('active');
    });

    document.getElementById('radioRetuneBtn').addEventListener('click', () => {
      this.tuneRandomSong();
    });

    document.getElementById('radioListenBtn').addEventListener('click', () => {
      this.radioModal.classList.remove('active');
      this.openListenModal(this.currentTunedSong);
    });

    document.getElementById('radioFavBtn').addEventListener('click', () => {
      this.toggleFavorite(this.currentTunedSong.id);
      this.tuneRandomSong();
    });

  // -------------------------------------------------------------
  // 時光靈感庫彈窗 (一鍵收錄，完全免打字)
  // -------------------------------------------------------------
  openInspirationModal() {
    if (!this.inspirationModal) return;
    this.renderInspirationList();
    this.inspirationModal.classList.add('active');
  }

  renderInspirationList() {
    const modalContent = document.getElementById('inspirationModalContent');
    if (!modalContent) return;

    const pool = this.data.INSPIRATION_POOL || [];
    const allSongs = this.getAllSongs();
    const existingIds = new Set(allSongs.map(s => s.id));

    let displayList = pool;
    if (this.activeInspirationTheme !== 'all') {
      displayList = pool.filter(s => s.theme === this.activeInspirationTheme);
    }

    modalContent.innerHTML = `
      <div class="modal-header">
        <div class="modal-badge">經典靈感候選庫</div>
        <h3 class="modal-title">✨ 時光靈感庫・一鍵收錄</h3>
        <p class="modal-artist">點擊「＋收進歌庫」，一秒收納進您的專屬時光機</p>
        <button class="modal-close-x" id="closeInspModalX">✕</button>
      </div>

      <div class="modal-body">
        <!-- 主題標籤切換 -->
        <div class="inspiration-theme-pills">
          <button class="theme-pill-btn ${this.activeInspirationTheme === 'all' ? 'active' : ''}" data-theme="all">
            全部靈感 (${pool.length})
          </button>
          <button class="theme-pill-btn ${this.activeInspirationTheme === 'rock_ufo' ? 'active' : ''}" data-theme="rock_ufo">
            💿 滾石飛碟傳奇
          </button>
          <button class="theme-pill-btn ${this.activeInspirationTheme === '90s_kings' ? 'active' : ''}" data-theme="90s_kings">
            🎤 九十天王天后
          </button>
          <button class="theme-pill-btn ${this.activeInspirationTheme === 'folk_classic' ? 'active' : ''}" data-theme="folk_classic">
            📻 校園民歌傳奇
          </button>
          <button class="theme-pill-btn ${this.activeInspirationTheme === 'western_billboard' ? 'active' : ''}" data-theme="western_billboard">
            🌟 西洋告示牌名曲
          </button>
        </div>

        <!-- 歌曲列表 -->
        <div class="inspiration-list-scroll">
          ${displayList.map(song => {
            const isAdded = existingIds.has(song.id);
            return `
              <div class="inspiration-song-row">
                <div class="inspiration-song-info">
                  <div class="inspiration-song-title">${song.title}</div>
                  <div class="inspiration-song-meta">
                    <span>${song.artist}</span> · <span>${song.year}</span> · <span>${song.themeLabel}</span>
                  </div>
                  <div class="inspiration-quote-snippet">「${song.quote}」</div>
                </div>

                <div>
                  ${isAdded ? `
                    <button class="inspiration-add-btn added" data-remove-insp="${song.id}" title="點擊可移除">
                      ✓ 已在時光機
                    </button>
                  ` : `
                    <button class="inspiration-add-btn" data-add-insp="${song.id}">
                      ＋ 收進歌庫
                    </button>
                  `}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    document.getElementById('closeInspModalX').addEventListener('click', () => {
      this.inspirationModal.classList.remove('active');
    });

    // 切換主題標籤
    modalContent.querySelectorAll('[data-theme]').forEach(btn => {
      btn.addEventListener('click', () => {
        this.activeInspirationTheme = btn.dataset.theme;
        this.renderInspirationList();
      });
    });

    // 點擊收錄
    modalContent.querySelectorAll('[data-add-insp]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.addInsp;
        const target = pool.find(s => s.id === id);
        if (target) {
          this.addSongFromInspiration(target);
        }
      });
    });

    // 點擊移除已收錄歌曲
    modalContent.querySelectorAll('[data-remove-insp]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.removeInsp;
        this.removeSongFromInspiration(id);
      });
    });
  }

  // -------------------------------------------------------------
  // 聆聽彈窗（合規導向 YouTube / Spotify / Apple Music）
  // -------------------------------------------------------------
  openListenModal(song) {
    this.activeListenSong = song;
    const query = `${song.artist} ${song.title}`;

    const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
    const spotifyUrl = `https://open.spotify.com/search/${encodeURIComponent(query)}`;
    const appleUrl = `https://music.apple.com/tw/search?term=${encodeURIComponent(query)}`;

    const modalContent = document.getElementById('listenModalContent');
    if (!modalContent) return;

    modalContent.innerHTML = `
      <div class="modal-header">
        <div class="modal-badge">合法官方平台聆聽</div>
        <h3 class="modal-title">${song.title}</h3>
        <p class="modal-artist">${song.artist} · ${song.year}</p>
        <button class="modal-close-x" id="closeListenModalX">✕</button>
      </div>

      <div class="modal-body">
        <div class="listen-compliance-notice">
          <span class="notice-icon">🛡️</span>
          <span>本時光機不儲存或下載任何音訊，點選平台後將前往官方頁面播放：</span>
        </div>

        <div class="platform-options-list">
          <a href="${ytUrl}" target="_blank" rel="noopener noreferrer" class="platform-btn yt-btn">
            <span class="platform-icon">▶</span>
            <div class="platform-text">
              <span class="platform-name">YouTube</span>
              <span class="platform-sub">官方音樂頻道搜尋</span>
            </div>
            <span class="platform-arrow">→</span>
          </a>

          <a href="${spotifyUrl}" target="_blank" rel="noopener noreferrer" class="platform-btn spotify-btn">
            <span class="platform-icon">🟢</span>
            <div class="platform-text">
              <span class="platform-name">Spotify</span>
              <span class="platform-sub">高音質串流官方搜尋</span>
            </div>
            <span class="platform-arrow">→</span>
          </a>

          <a href="${appleUrl}" target="_blank" rel="noopener noreferrer" class="platform-btn apple-btn">
            <span class="platform-icon">🍎</span>
            <div class="platform-text">
              <span class="platform-name">Apple Music</span>
              <span class="platform-sub">正版音樂資料庫搜尋</span>
            </div>
            <span class="platform-arrow">→</span>
          </a>
        </div>
      </div>
    `;

    document.getElementById('closeListenModalX').addEventListener('click', () => {
      this.closeListenModal();
    });

    this.listenModal.classList.add('active');
  }

  closeListenModal() {
    if (this.listenModal) {
      this.listenModal.classList.remove('active');
      this.activeListenSong = null;
    }
  }

  // -------------------------------------------------------------
  // 回憶筆記日記彈窗
  // -------------------------------------------------------------
  openMemoryModal(song) {
    this.activeMemorySong = song;
    const existing = this.memories[song.id] ? this.memories[song.id].note : '';

    const modalContent = document.getElementById('memoryModalContent');
    if (!modalContent) return;

    modalContent.innerHTML = `
      <div class="modal-header">
        <div class="modal-badge">人生音樂日記</div>
        <h3 class="modal-title">這首歌讓我想到……</h3>
        <p class="modal-artist">${song.artist}《${song.title}》</p>
        <button class="modal-close-x" id="closeMemoryModalX">✕</button>
      </div>

      <div class="modal-body">
        <!-- 快速回憶引導範例 -->
        <div class="memory-quick-prompts">
          <span class="quick-prompt-chip" data-prompt="第一次去英國時常常聽。">✈️ 第一次去英國時常常聽</span>
          <span class="quick-prompt-chip" data-prompt="以前開車時很喜歡這首。">🚗 以前開車時很喜歡這首</span>
          <span class="quick-prompt-chip" data-prompt="這是我和家人的珍貴回憶。">🏠 這是我和家人的回憶</span>
          <span class="quick-prompt-chip" data-prompt="高中放學回家路上，隨身聽裡總是這首歌。">🎒 高中放學回家路上的聲音</span>
          <span class="quick-prompt-chip" data-prompt="那年夏天，收音機裡反覆播著這段旋律。">📻 那年夏天的收音機</span>
        </div>

        <textarea 
          id="memoryNoteInput" 
          class="memory-textarea" 
          rows="5" 
          placeholder="寫下這首歌讓您想起的某個人、某個地方，或是那段回不去的珍貴時光……"
        >${this.escapeHtml(existing)}</textarea>

        <div class="modal-footer-actions">
          ${existing ? `
            <button class="secondary-danger-btn" id="deleteMemBtn">刪除回憶</button>
          ` : '<div></div>'}
          <div style="display: flex; gap: 8px;">
            <button class="secondary-btn" id="cancelMemBtn">取消</button>
            <button class="primary-btn" id="saveMemBtn">儲存回憶</button>
          </div>
        </div>
      </div>
    `;

    // 點擊快速範例填入文字
    modalContent.querySelectorAll('.quick-prompt-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const inp = document.getElementById('memoryNoteInput');
        if (inp) {
          if (inp.value.trim()) {
            inp.value += '\n' + chip.dataset.prompt;
          } else {
            inp.value = chip.dataset.prompt;
          }
          inp.focus();
        }
      });
    });

    document.getElementById('closeMemoryModalX').addEventListener('click', () => {
      this.closeMemoryModal();
    });

    document.getElementById('cancelMemBtn').addEventListener('click', () => {
      this.closeMemoryModal();
    });

    document.getElementById('saveMemBtn').addEventListener('click', () => {
      const inp = document.getElementById('memoryNoteInput');
      this.setMemory(song.id, inp.value);
      this.closeMemoryModal();
    });

    const delBtn = document.getElementById('deleteMemBtn');
    if (delBtn) {
      delBtn.addEventListener('click', () => {
        if (confirm('確定要刪除這首歌曲的回憶日記嗎？')) {
          this.deleteMemory(song.id);
          this.closeMemoryModal();
        }
      });
    }

    this.memoryModal.classList.add('active');
    setTimeout(() => {
      const inp = document.getElementById('memoryNoteInput');
      if (inp) inp.focus();
    }, 150);
  }

  closeMemoryModal() {
    if (this.memoryModal) {
      this.memoryModal.classList.remove('active');
      this.activeMemorySong = null;
    }
  }

  escapeHtml(text) {
    if (!text) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
}

// 頁面載入完成後啟動
document.addEventListener('DOMContentLoaded', () => {
  window.app = new YouthMusicApp();
});

  </script>

          })
          .catch((err) => {
            console.log('PWA Service Worker 註冊略過:', err);
          });
      });
    }
